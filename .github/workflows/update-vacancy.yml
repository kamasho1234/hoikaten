name: 保育所空き状況の更新

# 公開のタイミングは自治体ごとにずれる。
# 横浜市は毎月1日時点のデータだが掲載は数日遅れる（令和8年8月分は8月3日公開）。
# 目黒区は月2回（1日ごろと20日ごろ）BODIKにCSVを登録する。
# さいたま市は毎月1日時点のデータを1日（休日なら翌開庁日）に公開する。
# 大田区は翌月の利用調整に使う欠員リストを月初に公開する（8月分は7月2日現在で、次回更新は8月3日）。
# 足立区は翌月入所ぶんの募集人数を月初に公開する（9月入所分が8月1日現在）。PDFが3本に分かれている。
# 江戸川区は翌月入園ぶんの定員と募集数を月初に公開する（9月入園分が8月1日現在）。
# 練馬区は翌月入園ぶんの空き状況表を前月上旬に公表する（8月入園分が7月3日公表）。
# 世田谷区は月初に更新する（HTMLの表なのでPDFの読み取りが要らない）。
# 杉並区は入所希望月の前々月末に翌々月ぶんの募集予定人数を公表する（9月入所分が7月31日現在）。
# 葛飾区は入所希望月の前々月25日ごろに募集予定人数を公表する（9月選考分が7月25日現在）。
# 品川区は翌々月ぶんの入園可能数を前々月下旬に公表する（9月入園分が7月23日現在）。PDFが2本に分かれている。
# 江東区は翌々月ぶんの募集人員一覧を前々月下旬に公表する（9月入所分が7月23日現在）。
# 中野区は例月25日ごろに翌月1日入園ぶんの募集予定人数を更新する（基準日の記載が無く入園日だけが書かれる）。
# 新宿区は翌々月ぶんの募集見込数を前々月下旬に公開する（9月入園分が7月28日公開）。
# 豊島区は翌月選考ぶんの欠員状況を前月1日ごろに更新する（9月選考分が8月3日更新）。一覧→月別ページ→PDFの2段。
# そのため日次で見に行き、データの時点が変わったときだけ更新する。
# 取り込みスクリプトは想定と違う構造を検知すると exit 1 するため、
# 失敗した場合は既存のJSONがそのまま残る（壊れたデータを公開しない）。

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = JST 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # 川崎市とさいたま市はPDFしか公開していないため pdfplumber で表を読む。
      # pdftotext では日本語が落ちて数字だけになる
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PDF読み取り用の依存をインストール
        run: pip install -r scripts/requirements.txt

      # 自治体ごとに独立したステップにする。
      # ひとつの自治体が公式側の都合で落ちても他の自治体の更新は取り込みたいので
      # continue-on-error で続行し、最後にまとめて失敗を報告する。
      # 取り込みスクリプトは書き込み前に exit するため、失敗した自治体のJSONは変更されない。
      - name: 横浜市を取り込む
        id: yokohama
        continue-on-error: true
        run: npm run vacancy:fetch

      - name: 目黒区を取り込む
