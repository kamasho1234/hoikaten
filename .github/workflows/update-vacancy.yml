name: 保育所空き状況の更新

# 公開のタイミングは自治体ごとにずれる。
# 横浜市は毎月1日時点のデータだが掲載は数日遅れる（令和8年8月分は8月3日公開）。
# 目黒区は月2回（1日ごろと20日ごろ）BODIKにCSVを登録する。
# さいたま市は毎月1日時点のデータを1日（休日なら翌開庁日）に公開する。
# 大田区は翌月の利用調整に使う欠員リストを月初に公開する（8月分は7月2日現在で、次回更新は8月3日）。
# 足立区は翌月入所ぶんの募集人数を月初に公開する（9月入所分が8月1日現在）。PDFが3本に分かれている。
# 江戸川区は翌月入園ぶんの定員と募集数を月初に公開する（9月入園分が8月1日現在）。
# 練馬区は翌月入園ぶんの空き状況表を前月上旬に公表する（8月入園分が7月3日公表）。
# 世田谷区は月初に更新する（HTMLの表なのでPDFの読み取りが要らない）。
# 杉並区は入所希望月の前々月末に翌々月ぶんの募集予定人数を公表する（9月入所分が7月31日現在）。
# 葛飾区は入所希望月の前々月25日ごろに募集予定人数を公表する（9月選考分が7月25日現在）。
# 品川区は翌々月ぶんの入園可能数を前々月下旬に公表する（9月入園分が7月23日現在）。PDFが2本に分かれている。
# 江東区は翌々月ぶんの募集人員一覧を前々月下旬に公表する（9月入所分が7月23日現在）。
# 中野区は例月25日ごろに翌月1日入園ぶんの募集予定人数を更新する（基準日の記載が無く入園日だけが書かれる）。
# 新宿区は翌々月ぶんの募集見込数を前々月下旬に公開する（9月入園分が7月28日公開）。
# 豊島区は翌月選考ぶんの欠員状況を前月1日ごろに更新する（9月選考分が8月3日更新）。一覧→月別ページ→PDFの2段。
# そのため日次で見に行き、データの時点が変わったときだけ更新する。
# 取り込みスクリプトは想定と違う構造を検知すると exit 1 するため、
# 失敗した場合は既存のJSONがそのまま残る（壊れたデータを公開しない）。

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = JST 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 依存をインストール
        run: npm ci

      # 川崎市とさいたま市はPDFしか公開していないため pdfplumber で表を読む。
      # pdftotext では日本語が落ちて数字だけになる
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PDF読み取り用の依存をインストール
        run: pip install -r scripts/requirements.txt

      # 自治体ごとに独立したステップにする。
      # ひとつの自治体が公式側の都合で落ちても他の自治体の更新は取り込みたいので
      # continue-on-error で続行し、最後にまとめて失敗を報告する。
      # 取り込みスクリプトは書き込み前に exit するため、失敗した自治体のJSONは変更されない。
      - name: 横浜市を取り込む
        id: yokohama
        continue-on-error: true
        run: npm run vacancy:fetch

      - name: 目黒区を取り込む
        id: meguro
        continue-on-error: true
        run: npm run vacancy:fetch:meguro

      - name: 川崎市を取り込む
        id: kawasaki
        continue-on-error: true
        run: npm run vacancy:fetch:kawasaki

      - name: さいたま市を取り込む
        id: saitama
        continue-on-error: true
        run: npm run vacancy:fetch:saitama

      - name: 大田区を取り込む
        id: ota
        continue-on-error: true
        run: npm run vacancy:fetch:ota

      - name: 足立区を取り込む
        id: adachi
        continue-on-error: true
        run: npm run vacancy:fetch:adachi

      - name: 江戸川区を取り込む
        id: edogawa
        continue-on-error: true
        run: npm run vacancy:fetch:edogawa

      - name: 練馬区を取り込む
        id: nerima
        continue-on-error: true
        run: npm run vacancy:fetch:nerima

      - name: 世田谷区を取り込む
        id: setagaya
        continue-on-error: true
        run: npm run vacancy:fetch:setagaya

      - name: 杉並区を取り込む
        id: suginami
        continue-on-error: true
        run: npm run vacancy:fetch:suginami

      - name: 葛飾区を取り込む
        id: katsushika
        continue-on-error: true
        run: npm run vacancy:fetch:katsushika

      - name: 品川区を取り込む
        id: shinagawa
        continue-on-error: true
        run: npm run vacancy:fetch:shinagawa

      - name: 江東区を取り込む
        id: koto
        continue-on-error: true
        run: npm run vacancy:fetch:koto

      - name: 中野区を取り込む
        id: nakano
        continue-on-error: true
        run: npm run vacancy:fetch:nakano

      - name: 新宿区を取り込む
        id: shinjuku
        continue-on-error: true
        run: npm run vacancy:fetch:shinjuku

      - name: 豊島区を取り込む
        id: toshima
        continue-on-error: true
        run: npm run vacancy:fetch:toshima
      - name: 文京区を取り込む
        id: bunkyo
        continue-on-error: true
        run: npm run vacancy:fetch:bunkyo

      - name: 台東区を取り込む
        id: taito
        continue-on-error: true
        run: npm run vacancy:fetch:taito

      - name: 千代田区を取り込む
        id: chiyoda
        continue-on-error: true
        run: npm run vacancy:fetch:chiyoda

      # ここから下は失敗したらコミットしない（壊れたデータを公開しないため）
      - name: 型チェック
        run: npx tsc --noEmit

      - name: データの整合性を検証
        run: npm run vacancy:verify

      - name: 変更があればコミットする
        run: |
          if [ -z "$(git status --porcelain src/lib/vacancy)" ]; then
            echo "データの時点に変更がないため、コミットは行いません。"
            exit 0
          fi
          MSG="保育所空き状況を更新:"
          for f in $(git status --porcelain src/lib/vacancy | awk '{print $2}'); do
            case "$f" in
              *yokohama.json) MSG="$MSG 横浜市（$(node -p "require('./src/lib/vacancy/yokohama.json').asOf")時点）" ;;
              *meguro.json) MSG="$MSG 目黒区（$(node -p "require('./src/lib/vacancy/meguro.json').asOf")時点）" ;;
              *kawasaki.json) MSG="$MSG 川崎市（$(node -p "require('./src/lib/vacancy/kawasaki.json').asOf")時点）" ;;
              *saitama.json) MSG="$MSG さいたま市（$(node -p "require('./src/lib/vacancy/saitama.json').asOf")時点）" ;;
              *ota.json) MSG="$MSG 大田区（$(node -p "require('./src/lib/vacancy/ota.json').asOf")時点）" ;;
              *adachi.json) MSG="$MSG 足立区（$(node -p "require('./src/lib/vacancy/adachi.json').asOf")時点）" ;;
              *edogawa.json) MSG="$MSG 江戸川区（$(node -p "require('./src/lib/vacancy/edogawa.json').asOf")時点）" ;;
              *nerima.json) MSG="$MSG 練馬区（$(node -p "require('./src/lib/vacancy/nerima.json').asOf")時点）" ;;
              *setagaya.json) MSG="$MSG 世田谷区（$(node -p "require('./src/lib/vacancy/setagaya.json').asOf")時点）" ;;
              *suginami.json) MSG="$MSG 杉並区（$(node -p "require('./src/lib/vacancy/suginami.json').asOf")時点）" ;;
              *katsushika.json) MSG="$MSG 葛飾区（$(node -p "require('./src/lib/vacancy/katsushika.json').asOf")時点）" ;;
              *shinagawa.json) MSG="$MSG 品川区（$(node -p "require('./src/lib/vacancy/shinagawa.json').asOf")時点）" ;;
              *koto.json) MSG="$MSG 江東区（$(node -p "require('./src/lib/vacancy/koto.json').asOf")時点）" ;;
              *nakano.json) MSG="$MSG 中野区（$(node -p "require('./src/lib/vacancy/nakano.json').asOf")時点）" ;;
              *shinjuku.json) MSG="$MSG 新宿区（$(node -p "require('./src/lib/vacancy/shinjuku.json').asOf")時点）" ;;
              *toshima.json) MSG="$MSG 豊島区（$(node -p "require('./src/lib/vacancy/toshima.json').asOf")時点）" ;;
              *bunkyo.json) MSG="$MSG 文京区（$(node -p "require('./src/lib/vacancy/bunkyo.json').asOf")時点）" ;;
              *taito.json) MSG="$MSG 台東区（$(node -p "require('./src/lib/vacancy/taito.json').asOf")時点）" ;;
              *chiyoda.json) MSG="$MSG 千代田区（$(node -p "require('./src/lib/vacancy/chiyoda.json').asOf")時点）" ;;
            esac
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/vacancy
          git commit -m "$MSG"
          git push

      # 取り込みに失敗した自治体があれば、更新自体は済ませたうえで失敗として通知する
      - name: 取り込みの結果を判定する
        if: steps.yokohama.outcome == 'failure' || steps.meguro.outcome == 'failure' || steps.kawasaki.outcome == 'failure' || steps.saitama.outcome == 'failure' || steps.ota.outcome == 'failure' || steps.adachi.outcome == 'failure' || steps.edogawa.outcome == 'failure' || steps.nerima.outcome == 'failure' || steps.setagaya.outcome == 'failure' || steps.suginami.outcome == 'failure' || steps.katsushika.outcome == 'failure' || steps.shinagawa.outcome == 'failure' || steps.koto.outcome == 'failure' || steps.nakano.outcome == 'failure' || steps.shinjuku.outcome == 'failure' || steps.toshima.outcome == 'failure' || steps.bunkyo.outcome == 'failure' || steps.taito.outcome == 'failure' || steps.chiyoda.outcome == 'failure'
        run: |
          echo "取り込みに失敗した自治体があります:"
          echo "  横浜市: ${{ steps.yokohama.outcome }}"
          echo "  目黒区: ${{ steps.meguro.outcome }}"
          echo "  川崎市: ${{ steps.kawasaki.outcome }}"
          echo "  さいたま市: ${{ steps.saitama.outcome }}"
          echo "  大田区: ${{ steps.ota.outcome }}"
          echo "  足立区: ${{ steps.adachi.outcome }}"
          echo "  江戸川区: ${{ steps.edogawa.outcome }}"
          echo "  練馬区: ${{ steps.nerima.outcome }}"
          echo "  世田谷区: ${{ steps.setagaya.outcome }}"
          echo "  杉並区: ${{ steps.suginami.outcome }}"
          echo "  葛飾区: ${{ steps.katsushika.outcome }}"
          echo "  品川区: ${{ steps.shinagawa.outcome }}"
          echo "  江東区: ${{ steps.koto.outcome }}"
          echo "  中野区: ${{ steps.nakano.outcome }}"
          echo "  新宿区: ${{ steps.shinjuku.outcome }}"
          echo "  豊島区: ${{ steps.toshima.outcome }}"
          echo "  文京区: ${{ steps.bunkyo.outcome }}"
          echo "  台東区: ${{ steps.taito.outcome }}"
          echo "  千代田区: ${{ steps.chiyoda.outcome }}"
          echo "公式サイトの構造が変わっていないか確認してください。"
          exit 1
