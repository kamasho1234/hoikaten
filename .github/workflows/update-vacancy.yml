name: 保育所空き状況の更新

# 横浜市は毎月1日時点のデータを公開するが、実際の掲載は数日ずれる（令和8年8月分は8月3日公開）。
# そのため日次で公式ページを見に行き、データの時点が変わったときだけ更新する。
# 取り込みスクリプトは想定と違う構造を検知すると exit 1 するため、
# 失敗した場合は既存のJSONがそのまま残る（壊れたデータを公開しない）。

on:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = JST 10:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: 公式CSVを取り込む
        run: npm run vacancy:fetch

      - name: 型チェック
        run: npx tsc --noEmit

      - name: 変更があればコミットする
        run: |
          if [ -z "$(git status --porcelain src/lib/vacancy)" ]; then
            echo "データの時点に変更がないため、コミットは行いません。"
            exit 0
          fi
          ASOF=$(node -p "require('./src/lib/vacancy/yokohama.json').asOf")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/vacancy
          git commit -m "保育所空き状況を更新: 横浜市（${ASOF}時点）"
          git push
